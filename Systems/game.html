<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubNautika - Survival</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #00131f;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #game {
            position: fixed;
            inset: 0;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #00131f;
            z-index: 20;
            transition: opacity 0.7s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-box {
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .loading-title {
            font-size: 1.2rem;
            color: #71e8f2;
            margin-bottom: 12px;
        }

        .loading-subtitle {
            font-size: 0.75rem;
            color: #86aab7;
            letter-spacing: 1.5px;
        }

        #error {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(680px, 86vw);
            padding: 22px;
            box-sizing: border-box;
            background: rgba(20, 0, 5, 0.92);
            border: 1px solid rgba(255, 100, 120, 0.7);
            color: #ffd9de;
            z-index: 30;
            display: none;
            line-height: 1.5;
        }


        #controls-hint {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 11;
            padding: 9px 14px;
            background: rgba(0, 20, 30, 0.42);
            border: 1px solid rgba(110, 225, 240, 0.22);
            backdrop-filter: blur(5px);
            color: #b9dfe4;
            font-size: 0.72rem;
            letter-spacing: 1px;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        #controls-hint.hidden {
            opacity: 0;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 5px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(210, 250, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(100, 230, 245, 0.55);
            z-index: 10;
            pointer-events: none;
        }

        #hud {
            position: fixed;
            inset: 0;
            z-index: 9;
            pointer-events: none;
        }

        .hud-card {
            position: absolute;
            left: 24px;
            bottom: 24px;
            padding: 12px 16px;
            background: rgba(0, 20, 30, 0.45);
            border: 1px solid rgba(110, 225, 240, 0.25);
            backdrop-filter: blur(6px);
            font-size: 0.78rem;
            letter-spacing: 1px;
            color: #c5e7eb;
        }

        .hud-card span {
            color: #71e8f2;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <div id="loading">
        <div class="loading-box">
            <div class="loading-title">SubNautika</div>
            <div class="loading-subtitle">Initializing survival systems...</div>
        </div>
    </div>

    <div id="error"></div>

    <div id="controls-hint">CLICK TO LOCK MOUSE &nbsp;|&nbsp; WASD MOVE &nbsp;|&nbsp; SPACE UP &nbsp;|&nbsp; SHIFT DOWN</div>

    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-card">
            DEPTH <span id="depth">15 m</span>
            &nbsp;&nbsp;|&nbsp;&nbsp;
            OXYGEN <span id="oxygen">100%</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../code/terrain.js"></script>
    <script src="../code/underwater.js"></script>
    <script src="../code/surfaceWater.js"></script>

    <script>
        (() => {
            const container = document.getElementById("game");
            const depthElement = document.getElementById("depth");
            const loading = document.getElementById("loading");
            const errorElement = document.getElementById("error");

            let scene;
            let camera;
            let renderer;
            let terrain;
            let animationStarted = false;

            const keys = Object.create(null);
            let pointerLocked = false;

            const movement = {
                speed: 18,
                verticalSpeed: 14,
                sensitivity: 0.0022,
                yaw: 0,
                pitch: 0
            };

            function showError(message) {
                loading.classList.add("hidden");
                errorElement.style.display = "block";
                errorElement.textContent = "SubNautika could not start: " + message;
            }

            try {
                if (!window.THREE) {
                    throw new Error("Three.js did not load.");
                }

                if (!window.SubNautikaTerrain) {
                    throw new Error("terrain.js did not load. Check the Systems/../code/ path.");
                }

                scene = new THREE.Scene();

                // First-person 3D camera.
                camera = new THREE.PerspectiveCamera(
                    72,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    5000
                );

                camera.position.set(0, 34, 115);

                movement.yaw = 0;
                movement.pitch = -0.28;

                camera.rotation.order = "YXZ";
                camera.rotation.y = movement.yaw;
                camera.rotation.x = movement.pitch;

                // WebGL renderer.
                renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: false
                });

                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                if ("outputEncoding" in renderer) {
                    renderer.outputEncoding = THREE.sRGBEncoding;
                }

                container.appendChild(renderer.domElement);

                // World atmosphere is controlled by underwater.js.
                // Surface waves are a separate system and only activate near the surface.
                const underwater = SubNautikaUnderwater.init(scene);
                const surfaceWater = SubNautikaSurfaceWater.init(scene, camera);

                const terrainMaterial = new THREE.MeshStandardMaterial({
                    color: 0x245b54,
                    roughness: 0.90,
                    metalness: 0.0
                });

                terrain = SubNautikaTerrain.init({
                    scene,
                    camera,
                    material: terrainMaterial
                });

                setupControls();

                let time = 0;
                const clock = new THREE.Clock();

                function updateCameraRotation() {
                    const limit = Math.PI * 0.49;
                    movement.pitch = Math.max(-limit, Math.min(limit, movement.pitch));

                    camera.rotation.order = "YXZ";
                    camera.rotation.y = movement.yaw;
                    camera.rotation.x = movement.pitch;
                }

                function updateMovement(delta) {
                    const forward = new THREE.Vector3();
                    const right = new THREE.Vector3();
                    const up = new THREE.Vector3(0, 1, 0);

                    camera.getWorldDirection(forward);
                    right.crossVectors(forward, up).normalize();

                    // Swimming is full 3D. Looking up/down changes the W/S travel direction.
                    const move = new THREE.Vector3();

                    if (keys["KeyW"]) move.add(forward);
                    if (keys["KeyS"]) move.sub(forward);
                    if (keys["KeyD"]) move.add(right);
                    if (keys["KeyA"]) move.sub(right);
                    if (keys["Space"]) move.add(up);
                    if (keys["ShiftLeft"] || keys["ShiftRight"]) move.sub(up);

                    if (move.lengthSq() > 0) {
                        move.normalize();

                        const currentSpeed =
                            (keys["ShiftLeft"] || keys["ShiftRight"])
                                ? movement.verticalSpeed
                                : movement.speed;

                        camera.position.addScaledVector(
                            move,
                            currentSpeed * delta
                        );
                    }
                }

                function animate() {
                    requestAnimationFrame(animate);

                    const delta = Math.min(
                        clock.getDelta(),
                        0.05
                    );

                    time += delta;

                    updateMovement(delta);
                    terrain.update(delta);

                    // Switch environment behavior by height.
                    underwater.update(camera.position.y);
                    surfaceWater.update(time);

                    depthElement.textContent =
                        Math.max(0, Math.round(42 - camera.position.y)) + " m";

                    renderer.render(scene, camera);
                }


                function setupControls() {
                    const hint = document.getElementById("controls-hint");

                    renderer.domElement.addEventListener("click", () => {
                        renderer.domElement.requestPointerLock();
                    });

                    document.addEventListener("pointerlockchange", () => {
                        pointerLocked =
                            document.pointerLockElement === renderer.domElement;

                        hint.classList.toggle("hidden", pointerLocked);
                    });

                    document.addEventListener("mousemove", (event) => {
                        if (!pointerLocked) return;

                        movement.yaw -= event.movementX * movement.sensitivity;
                        movement.pitch -= event.movementY * movement.sensitivity;

                        updateCameraRotation();
                    });

                    window.addEventListener("keydown", (event) => {
                        keys[event.code] = true;

                        if (
                            ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)
                        ) {
                            event.preventDefault();
                        }
                    });

                    window.addEventListener("keyup", (event) => {
                        keys[event.code] = false;
                    });

                    window.addEventListener("blur", () => {
                        for (const key in keys) {
                            keys[key] = false;
                        }
                    });
                }

                animate();
                animationStarted = true;

                setTimeout(() => {
                    loading.classList.add("hidden");
                }, 450);

            } catch (error) {
                console.error(error);
                showError(error.message || String(error));
            }

            window.addEventListener("resize", () => {
                if (!camera || !renderer) {
                    return;
                }

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            });
        })();
    </script>
</body>
</html>
