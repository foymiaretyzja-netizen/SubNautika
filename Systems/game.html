<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubNautika - Survival</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #00131f;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #game {
            position: fixed;
            inset: 0;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #00131f;
            z-index: 20;
            transition: opacity 0.7s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-box {
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .loading-title {
            font-size: 1.2rem;
            color: #71e8f2;
            margin-bottom: 12px;
        }

        .loading-subtitle {
            font-size: 0.75rem;
            color: #86aab7;
            letter-spacing: 1.5px;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 4px;
            height: 4px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(210, 250, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(100, 230, 245, 0.5);
            z-index: 10;
            pointer-events: none;
        }

        #hud {
            position: fixed;
            inset: 0;
            z-index: 9;
            pointer-events: none;
        }

        .hud-card {
            position: absolute;
            left: 24px;
            bottom: 24px;
            padding: 12px 16px;
            background: rgba(0, 20, 30, 0.45);
            border: 1px solid rgba(110, 225, 240, 0.25);
            backdrop-filter: blur(6px);
            font-size: 0.78rem;
            letter-spacing: 1px;
            color: #c5e7eb;
        }

        .hud-card span {
            color: #71e8f2;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <div id="loading">
        <div class="loading-box">
            <div class="loading-title">SubNautika</div>
            <div class="loading-subtitle">Initializing survival systems...</div>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-card">
            DEPTH <span id="depth">0 m</span>
            &nbsp;&nbsp;|&nbsp;&nbsp;
            OXYGEN <span id="oxygen">100%</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const container = document.getElementById("game");
        const depthElement = document.getElementById("depth");

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.05,
            4000
        );

        camera.position.set(0, 3, 12);
        camera.lookAt(0, 2, -100);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // Temporary underwater world foundation.
        // This will be replaced by the real terrain, player, creatures,
        // resources, lighting, and water systems as the game grows.
        scene.background = new THREE.Color(0x032431);
        scene.fog = new THREE.FogExp2(0x032431, 0.025);

        scene.add(new THREE.HemisphereLight(0x5bc9d8, 0x001016, 0.8));

        const sun = new THREE.DirectionalLight(0x8debf3, 0.45);
        sun.position.set(-100, 150, 40);
        scene.add(sun);

        // Simple deep-ocean floor placeholder.
        const floorGeometry = new THREE.PlaneGeometry(1000, 1000, 32, 32);
        floorGeometry.rotateX(-Math.PI / 2);

        const floorMaterial = new THREE.MeshLambertMaterial({
            color: 0x123c41
        });

        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.position.y = -30;
        scene.add(floor);

        // A few placeholder particles give the underwater scene some depth.
        const particleCount = 1800;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 500;
            positions[i3 + 1] = Math.random() * 180 - 40;
            positions[i3 + 2] = (Math.random() - 0.5) * 800;
        }

        particles.setAttribute(
            "position",
            new THREE.BufferAttribute(positions, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
            color: 0x9de9e7,
            size: 0.16,
            transparent: true,
            opacity: 0.38,
            depthWrite: false
        });

        scene.add(new THREE.Points(particles, particleMaterial));

        let time = 0;

        function animate() {
            requestAnimationFrame(animate);

            time += 0.002;

            // Gentle camera bob for now.
            camera.position.x = Math.sin(time * 0.8) * 0.12;
            camera.position.y = 3 + Math.sin(time * 1.3) * 0.05;
            camera.lookAt(0, 2, -100);

            depthElement.textContent = "0 m";

            renderer.render(scene, camera);
        }

        animate();

        requestAnimationFrame(() => {
            document.getElementById("loading").classList.add("hidden");
        });

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
