<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnautika</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #7ca3c8 0%, #b8d0e0 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        #world {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        .logo-container {
            width: 100%;
            text-align: center;
            margin-top: 8vh;
        }

        .logo-container img {
            max-width: 600px;
            width: 70%;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        .interactive-area {
            position: absolute;
            inset: 0;
            pointer-events: auto;
        }

        .main-menu {
            position: absolute;
            bottom: 12vh;
            left: 15vw;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-menu.shifted {
            transform: translateX(-12vw);
        }

        .menu-btn {
            background: linear-gradient(90deg, rgba(0,80,130,.8), rgba(0,140,200,.5));
            border: 1.5px solid rgba(77,250,255,.7);
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 40px 12px 55px;
            cursor: pointer;
            width: 260px;
            text-align: left;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            box-shadow: 0 6px 15px rgba(0,0,0,.3);
            backdrop-filter: blur(6px);
            transition: .3s ease;
        }

        .menu-btn:hover {
            transform: scale(1.03) translateX(10px);
            box-shadow: 0 0 20px rgba(77,250,255,.5);
        }

        .gamemode-menu {
            position: absolute;
            bottom: 12vh;
            left: 42vw;
            width: 380px;
            padding: 25px;
            color: white;
            background: rgba(0,30,60,.85);
            border: 1px solid rgba(77,250,255,.5);
            border-radius: 4px;
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transform: translateX(30px);
            transition: .6s cubic-bezier(.16,1,.3,1);
            box-shadow: 0 10px 40px rgba(0,0,0,.7);
        }

        .gamemode-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .gamemode-title {
            margin: 0 0 20px;
            padding-bottom: 10px;
            color: #4dfaff;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid rgba(77,250,255,.2);
        }

        .gamemode-item {
            padding: 15px;
            background: rgba(0,100,160,.3);
            border: 1px solid rgba(77,250,255,.3);
            cursor: pointer;
            transition: .2s;
        }

        .gamemode-item:hover {
            background: rgba(0,160,255,.4);
            border-color: #4dfaff;
        }

        .gamemode-item h3 {
            margin: 0 0 5px;
            font-size: 1.1rem;
        }

        .gamemode-item p {
            margin: 0;
            color: #adcad6;
            font-size: .8rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="world"></div>

    <div id="ui-layer">
        <div class="logo-container">
            <img src="textures/Subnautika.png" alt="Subnautika">
        </div>

        <div class="interactive-area">
            <div class="main-menu" id="mainMenu">
                <button class="menu-btn" onclick="togglePlayMenu()">Play</button>
                <button class="menu-btn" onclick="showNotAccessible()">Options</button>
                <button class="menu-btn" onclick="showNotAccessible()">Quit</button>
            </div>

            <div class="gamemode-menu" id="gamemodeMenu">
                <h2 class="gamemode-title">New Game</h2>
                <div class="gamemode-item" onclick="startGame()">
                    <h3>Survival</h3>
                    <p>Standard play: manage vitals and explore the alien depths.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <script src="World%20Preset/water.js"></script>
    <script src="World%20Preset/clouds.js"></script>
    <script src="World%20Preset/world.js"></script>

    <script>
        SubNautikaWorld.init(document.getElementById("world"));

        let isPlayMenuOpen = false;

        function togglePlayMenu() {
            const mainMenu = document.getElementById("mainMenu");
            const gamemodeMenu = document.getElementById("gamemodeMenu");

            isPlayMenuOpen = !isPlayMenuOpen;
            mainMenu.classList.toggle("shifted", isPlayMenuOpen);
            gamemodeMenu.classList.toggle("active", isPlayMenuOpen);
        }

        function showNotAccessible() {
            alert("Not accessible yet!");
        }

        function startGame() {
            window.location.href = "Systems/game.html";
        }
    </script>
</body>
</html>
