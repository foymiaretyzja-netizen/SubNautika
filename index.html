<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SubNautika</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        overflow:hidden;
        background:black;
    }

    canvas{
        position:fixed;
        inset:0;
        width:100%;
        height:100%;
        z-index:-2;
    }

    .fog{
        position:fixed;
        inset:0;
        background:
            linear-gradient(to bottom,
            rgba(180,190,200,0.65) 0%,
            rgba(80,120,160,0.15) 40%,
            rgba(0,20,40,0.5) 100%);
        z-index:-1;
    }

    .main-menu{
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%, -50%);
        width:900px;
        height:500px;
        transition:0.7s ease;
    }

    .main-menu.shifted{
        transform:translate(-65%, -50%);
    }

    .logo{
        width:520px;
        image-rendering:auto;
        user-select:none;
        pointer-events:none;
        margin-bottom:20px;
        filter:drop-shadow(0 0 12px rgba(255,255,255,0.2));
    }

    .menu-content{
        display:flex;
        gap:30px;
        align-items:flex-start;
    }

    .button-panel{
        display:flex;
        flex-direction:column;
        gap:14px;
        width:220px;
    }

    .menu-btn{
        padding:13px;
        border-radius:12px;
        border:2px solid rgba(110,220,255,0.9);
        background:
            linear-gradient(to bottom,
            rgba(70,170,255,0.9),
            rgba(20,80,180,0.9));
        color:white;
        font-size:18px;
        cursor:pointer;
        transition:0.25s;
        box-shadow:
            0 0 12px rgba(0,180,255,0.45),
            inset 0 0 12px rgba(255,255,255,0.18);
    }

    .menu-btn:hover{
        transform:translateX(8px);
        filter:brightness(1.15);
    }

    .info-panel{
        width:370px;
        min-height:260px;
        padding:20px;
        border-radius:16px;
        background:rgba(20,80,140,0.72);
        border:2px solid rgba(110,220,255,0.6);
        color:white;
        backdrop-filter:blur(4px);
        box-shadow:0 0 20px rgba(0,140,255,0.25);
        overflow:hidden;
        position:relative;
    }

    .info-panel h2{
        margin-bottom:10px;
        color:#9cecff;
    }

    .gamemode-panel{
        position:absolute;
        top:0;
        right:-420px;
        width:370px;
        height:100%;
        padding:20px;
        border-radius:16px;
        background:rgba(10,40,90,0.94);
        border:2px solid rgba(110,220,255,0.6);
        transition:0.7s ease;
    }

    .gamemode-panel.active{
        right:0;
    }

    .survival-card{
        margin-top:20px;
        padding:18px;
        border-radius:14px;
        background:rgba(0,120,255,0.18);
        border:1px solid rgba(120,220,255,0.5);
        transition:0.25s;
        cursor:pointer;
    }

    .survival-card:hover{
        transform:scale(1.02);
        background:rgba(0,160,255,0.28);
    }

    .survival-title{
        font-size:24px;
        margin-bottom:8px;
        color:#8ee9ff;
    }

    .tiny{
        opacity:0.7;
        font-size:14px;
    }

    .popup{
        position:fixed;
        left:50%;
        top:85%;
        transform:translateX(-50%);
        background:rgba(10,20,30,0.9);
        color:white;
        padding:14px 22px;
        border-radius:14px;
        border:1px solid rgba(100,220,255,0.5);
        opacity:0;
        pointer-events:none;
        transition:0.3s;
    }

    .popup.show{
        opacity:1;
        top:82%;
    }

</style>
</head>
<body>

<canvas id="water"></canvas>
<div class="fog"></div>

<div class="main-menu" id="mainMenu">

    <img class="logo" src="textures/Subnautika.png">

    <div class="menu-content">

        <div class="button-panel">
            <button class="menu-btn" id="playBtn">Play</button>
            <button class="menu-btn" onclick="showPopup()">Options</button>
            <button class="menu-btn" onclick="showPopup()">Quit</button>
        </div>

        <div class="info-panel">
            <h2>Welcome</h2>

            <p>
                Dive into endless water beneath an ancient sky.
                Strange currents ripple across forgotten oceans while
                distant shapes drift below the surface.
            </p>

            <br>

            <p class="tiny">
                Dynamic ocean rendering enabled.
            </p>

            <div class="gamemode-panel" id="gamemodePanel">
                <h2>Choose Gamemode</h2>

                <div class="survival-card">
                    <div class="survival-title">Survival</div>

                    <p>
                        Gather resources, survive the depths,
                        and explore the unknown.
                    </p>
                </div>

            </div>

        </div>

    </div>
</div>

<div class="popup" id="popup">
    Not accessable yet!
</div>

<script>
const canvas = document.getElementById("water");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let time = 0;

function drawWater(){

    const w = canvas.width;
    const h = canvas.height;

    // sky
    let sky = ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0, "#bfc6cd");
    sky.addColorStop(0.35, "#8796a8");
    sky.addColorStop(1, "#08263f");

    ctx.fillStyle = sky;
    ctx.fillRect(0,0,w,h);

    // horizon glow
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(0, h*0.38, w, 6);

    // water
    for(let y = h * 0.4; y < h; y += 3){

        let depth = (y - h*0.4) / (h*0.6);

        let r = 0;
        let g = 40 + depth * 50;
        let b = 70 + depth * 80;

        ctx.strokeStyle = `rgba(${r},${g},${b},0.9)`;

        ctx.beginPath();

        for(let x = 0; x < w; x++){

            let wave =
                Math.sin((x * 0.012) + time + y * 0.015) * 8 +
                Math.sin((x * 0.02) + time * 1.7) * 4 +
                Math.sin((x * 0.005) + time * 0.5 + y * 0.04) * 14;

            let noise =
                Math.sin((x+y) * 0.03 + time * 0.9) * 2;

            let finalY = y + wave + noise;

            if(x === 0){
                ctx.moveTo(x, finalY);
            } else {
                ctx.lineTo(x, finalY);
            }
        }

        ctx.stroke();
    }

    // little water shine streaks
    for(let i = 0; i < 60; i++){

        let x = (i * 170 + time * 40) % (w + 200) - 100;
        let y = h * 0.48 + Math.sin(i + time) * 50;

        ctx.fillStyle = "rgba(255,255,255,0.04)";
        ctx.fillRect(x, y, 80, 2);
    }

    time += 0.01;

    requestAnimationFrame(drawWater);
}

drawWater();

const playBtn = document.getElementById("playBtn");
const gamemodePanel = document.getElementById("gamemodePanel");
const mainMenu = document.getElementById("mainMenu");

playBtn.addEventListener("click", () => {

    mainMenu.classList.add("shifted");

    setTimeout(() => {
        gamemodePanel.classList.add("active");
    }, 250);

});

function showPopup(){

    const popup = document.getElementById("popup");

    popup.classList.add("show");

    setTimeout(() => {
        popup.classList.remove("show");
    }, 1800);
}
</script>

</body>
</html>
