<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Screen</title>
    <style>
        /* --- Reset & Base Styles --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* Realistic, soft sky background (Back layer) */
            background: linear-gradient(to bottom, #7ca3c8 0%, #b8d0e0 100%);
        }

        /* --- 3D Canvas Background (Middle layer) --- */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Sits above the body background */
        }

        /* --- UI Overlay (Front layer) --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* Sits above the 3D canvas */
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        /* --- Logo --- */
        .logo-container {
            width: 100%;
            text-align: center;
            margin-top: 10vh;
        }
        .logo-container img {
            max-width: 600px;
            width: 80%;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
        }

        /* --- Interactive Container --- */
        .interactive-area {
            flex-grow: 1;
            position: relative;
            pointer-events: auto;
        }

        /* --- Main Menu --- */
        .main-menu {
            position: absolute;
            bottom: 15vh;
            left: 20vw;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.5s ease-in-out, opacity 0.5s ease;
        }

        .main-menu.shifted {
            transform: translateX(-10vw);
        }

        .menu-btn {
            background: linear-gradient(90deg, rgba(0, 105, 180, 0.8) 0%, rgba(0, 160, 255, 0.6) 100%);
            border: 2px solid #4dfaff;
            border-radius: 25px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 40px 10px 50px;
            cursor: pointer;
            position: relative;
            text-align: left;
            width: 250px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }

        .menu-btn:hover {
            background: linear-gradient(90deg, rgba(0, 140, 220, 0.9) 0%, rgba(50, 200, 255, 0.8) 100%);
            box-shadow: 0 0 15px #4dfaff;
            transform: scale(1.05);
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            border: 2px solid #4dfaff;
            border-radius: 50%;
            background: transparent;
        }

        /* --- Gamemode Menu --- */
        .gamemode-menu {
            position: absolute;
            bottom: 15vh;
            left: 45vw;
            background: rgba(0, 50, 100, 0.75);
            backdrop-filter: blur(5px);
            border: 2px solid #4dfaff;
            border-radius: 8px;
            width: 400px;
            padding: 20px;
            color: white;
            opacity: 0;
            visibility: hidden;
            transform: translateX(20px);
            transition: all 0.5s ease-in-out;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .gamemode-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .gamemode-title {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #4dfaff;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(77, 250, 255, 0.3);
            padding-bottom: 10px;
        }

        .gamemode-item {
            background: rgba(0, 105, 180, 0.5);
            border: 1px solid #4dfaff;
            border-radius: 5px;
            padding: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .gamemode-item:hover {
            background: rgba(0, 160, 255, 0.6);
        }

        .gamemode-item h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .gamemode-item p {
            margin: 0;
            font-size: 0.85rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="logo-container">
            <img src="textures/Subnautika.png" alt="Game Logo">
        </div>

        <div class="interactive-area">
            <div class="main-menu" id="mainMenu">
                <button class="menu-btn" onclick="togglePlayMenu()">Play</button>
                <button class="menu-btn" onclick="showNotAccessible()">Options</button>
                <button class="menu-btn" onclick="showNotAccessible()">Quit</button>
            </div>

            <div class="gamemode-menu" id="gamemodeMenu">
                <h2 class="gamemode-title">New Game</h2>
                <div class="gamemode-item" onclick="startGame()">
                    <h3>Survival</h3>
                    <p>Scavenge resources, manage hunger/thirst, and survive the depths.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <script>
        // --- UI LOGIC ---
        let isPlayMenuOpen = false;

        function togglePlayMenu() {
            const mainMenu = document.getElementById('mainMenu');
            const gamemodeMenu = document.getElementById('gamemodeMenu');
            isPlayMenuOpen = !isPlayMenuOpen;

            if (isPlayMenuOpen) {
                mainMenu.classList.add('shifted');
                gamemodeMenu.classList.add('active');
            } else {
                mainMenu.classList.remove('shifted');
                gamemodeMenu.classList.remove('active');
            }
        }

        function showNotAccessible() {
            alert('Not accessible yet!');
        }

        function startGame() {
            alert('Starting Survival mode...');
        }

        // --- 3D WATER GENERATION ---
        const container = document.getElementById('canvas-container');
        
        // Scene setup
        const scene = new THREE.Scene();
        // Fog matches the bottom color of the CSS sky gradient to blend the horizon
        scene.fog = new THREE.FogExp2(0xb8d0e0, 0.001);

        // Camera setup - Lowered to see the horizon and wave depth better
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(0, 40, 150); 
        camera.lookAt(0, 0, -200);

        // Renderer setup - Alpha set to true to allow CSS background to show through
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0); // Fully transparent renderer background
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Lighting to emphasize 3D geometry
        const ambientLight = new THREE.AmbientLight(0x404040, 1.2); 
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(-100, 100, 50);
        scene.add(directionalLight);

        // Water Plane Geometry - High segment count for smooth wave curves
        const geometry = new THREE.PlaneGeometry(3000, 3000, 150, 150);
        geometry.rotateX(-Math.PI / 2); 

        // Material - Tweaked for a realistic, slightly translucent water feel
        const material = new THREE.MeshPhongMaterial({
            color: 0x1ca3ec,
            emissive: 0x003366, // Gives the deep water a darker blue base
            specular: 0xffffff,
            shininess: 90,
            flatShading: false, // Smooth shading for realistic curves
            transparent: true,
            opacity: 0.85
        });

        const water = new THREE.Mesh(geometry, material);
        scene.add(water);

        // Noise setup
        const simplex = new SimplexNoise();
        const posAttribute = geometry.attributes.position;
        let time = 0;

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            time += 0.002; // Slower, more majestic wave speed

            // Modify vertices
            for (let i = 0; i < posAttribute.count; i++) {
                const x = posAttribute.getX(i);
                const z = posAttribute.getZ(i);
                
                const noiseScale = 0.003; // Wider waves
                const waveHeight = 18;    // Taller waves
                
                const y = simplex.noise3D(x * noiseScale, z * noiseScale, time) * waveHeight;
                posAttribute.setY(i, y);
            }
            
            posAttribute.needsUpdate = true;
            geometry.computeVertexNormals(); // Crucial for lighting to cast shadows on waves

            // Gentle camera sway
            camera.position.x = Math.sin(time) * 30;
            camera.lookAt(0, 0, -200);

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
