<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subnautika - Deep Ocean</title>
    <style>
        :root {
            --sub-cyan: #00d4ff;
            --ocean-murk: #002b36;
            --panel-glass: rgba(0, 20, 30, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            /* Realistic overcast atmospheric sky */
            background: linear-gradient(to bottom, #2c3e50 0%, #4a6680 40%, #8e9eab 65%);
        }

        canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80%; /* Higher horizon for more ocean scale */
            z-index: 1;
        }

        /* UI Wrapper - The 'Scene' */
        #ui-scene {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.9s cubic-bezier(0.2, 1, 0.3, 1);
            will-change: transform;
        }

        /* Left Side: Main Menu */
        .menu-section {
            min-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 520px;
            margin-bottom: 60px;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: rgba(0, 30, 40, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: #fff;
            width: 300px;
            padding: 16px 25px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            border-radius: 2px;
            text-align: left;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }

        .btn:hover {
            background: var(--sub-cyan);
            color: #001a33;
            transform: translateX(15px);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
        }

        /* Right Side: Gamemodes */
        .gamemode-section {
            min-width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 50px;
        }

        .gamemode-panel {
            width: 450px;
            background: var(--panel-glass);
            border-left: 2px solid var(--sub-cyan);
            padding: 40px;
            color: white;
            box-shadow: -50px 0 100px rgba(0,0,0,0.5);
        }

        .mode-card {
            background: rgba(255,255,255,0.03);
            padding: 25px;
            margin-top: 25px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .mode-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--sub-cyan);
        }

        /* State Shift */
        body.selecting-mode #ui-scene {
            transform: translateX(-40%);
        }
    </style>
</head>
<body>

    <canvas id="ocean"></canvas>

    <div id="ui-scene">
        <div class="menu-section">
            <img src="textures/Subnautika.png" alt="SUBNAUTIKA" class="logo">
            <div class="nav-group">
                <button class="btn" onclick="openModes()">Play</button>
                <button class="btn" onclick="alert('Not accessible yet!')">Options</button>
                <button class="btn" onclick="alert('Not accessible yet!')">Quit</button>
            </div>
        </div>

        <div class="gamemode-section">
            <div class="gamemode-panel">
                <h1 style="margin:0; font-weight: 300; letter-spacing: 8px;">SELECT MODE</h1>
                <div class="mode-card" onclick="alert('Loading Survival...')">
                    <h3 style="margin:0; color: var(--sub-cyan); letter-spacing: 2px;">SURVIVAL</h3>
                    <p style="font-size: 0.9rem; opacity: 0.6; line-height: 1.6;">Explore, craft, and survive in the deep murky blue.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ocean');
        const ctx = canvas.getContext('2d');

        let width, height, time = 0;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 3D Ocean Constants
        const gridX = 45;
        const gridY = 35;
        const spacing = 55;

        function project(x, y, z) {
            const perspective = 700;
            const scale = perspective / (perspective + y);
            const sx = (x * scale) + (width / 2);
            const sy = (z * scale) + (y * 0.35) + (height * 0.35);
            return { x: sx, y: sy, scale: scale };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            time += 0.007;

            // Draw from back to front (Painter's Algorithm)
            for (let y = gridY; y >= 0; y--) {
                for (let x = -gridX / 2; x < gridX / 2; x++) {
                    
                    // The "Complex Wave" Math
                    // Layering 3 different octaves for organic 3D movement
                    const getZ = (xi, yi) => {
                        let val = Math.sin(xi * 0.2 + time * 1.5) * 12;
                        val += Math.cos(yi * 0.2 + time * 2) * 15;
                        val += Math.sin((xi + yi) * 0.1 + time) * 8; // Cross wave
                        return val;
                    };

                    const p1 = project(x * spacing, y * spacing, getZ(x, y));
                    const p2 = project((x + 1) * spacing, y * spacing, getZ(x + 1, y));
                    const p3 = project((x + 1) * spacing, (y + 1) * spacing, getZ(x + 1, (y + 1)));
                    const p4 = project(x * spacing, (y + 1) * spacing, getZ(x, (y + 1)));

                    // Calculate Murky Color
                    // Waves further away (higher Y) are darker and faded
                    const depthFactor = y / gridY;
                    const r = 0;
                    const g = Math.floor(35 + (depthFactor * 25));
                    const b = Math.floor(45 + (depthFactor * 30));
                    const alpha = 1 - (depthFactor * 0.8);

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.lineTo(p4.x, p4.y);
                    ctx.closePath();

                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    ctx.fill();

                    // Edge highlights for the "water surface" look
                    ctx.strokeStyle = `rgba(0, 212, 255, ${alpha * 0.15})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
            requestAnimationFrame(draw);
        }

        function openModes() {
            document.body.classList.add('selecting-mode');
        }

        draw();
    </script>
</body>
</html>
