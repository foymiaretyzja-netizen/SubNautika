<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subnautika - Atmospheric Menu</title>
    <style>
        :root {
            --sub-blue: #00d4ff;
            --panel-bg: rgba(5, 15, 25, 0.85);
            --text-glow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Realistic atmospheric sky gradient */
            background: linear-gradient(to bottom, #4a6680 0%, #7da2b8 40%, #abbec7 60%);
        }

        canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%; /* Ocean depth */
            z-index: 1;
        }

        /* Main UI Container */
        #ui-viewport {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Smooth Transition Groups */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .logo {
            width: 550px;
            margin-bottom: 50px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }

        /* Buttons */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: white;
            width: 260px;
            padding: 14px 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: var(--sub-blue);
            color: #001a33;
            border-color: #fff;
            transform: translateX(10px);
            box-shadow: var(--text-glow);
        }

        /* Gamemode Panel */
        #gamemode-panel {
            position: absolute;
            right: -600px; /* Hidden off-screen */
            width: 450px;
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            color: white;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
            border-radius: 4px 0 0 4px;
        }

        .mode-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            margin-top: 20px;
            border-left: 3px solid var(--sub-blue);
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-card:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Logic for Smooth Move */
        body.menu-open .main-content {
            transform: translateX(-25%);
        }

        body.menu-open #gamemode-panel {
            transform: translateX(-600px); /* Slides into view */
        }
    </style>
</head>
<body>

    <canvas id="ocean"></canvas>

    <div id="ui-viewport">
        <div class="main-content">
            <img src="textures/Subnautika.png" alt="SUBNAUTIKA" class="logo">
            
            <div class="btn-list">
                <button class="btn" onclick="openPlayMenu()">Play</button>
                <button class="btn" onclick="alert('Not accessible yet!')">Options</button>
                <button class="btn" onclick="alert('Not accessible yet!')">Quit</button>
            </div>
        </div>

        <div id="gamemode-panel">
            <h1 style="margin: 0; font-weight: 300; letter-spacing: 5px;">NEW GAME</h1>
            <div class="mode-card" onclick="alert('Starting...')">
                <h3 style="margin: 0; color: var(--sub-blue);">SURVIVAL</h3>
                <p style="font-size: 0.85rem; opacity: 0.7; line-height: 1.6;">
                    Crash land in a dangerous environment, scavenge resources and manage oxygen levels to survive.
                </p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ocean');
        const ctx = canvas.getContext('2d');

        let width, height, time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 3D Ocean Simulation Constants
        const gridX = 40; // Number of "points" across
        const gridY = 30; // Number of "points" deep
        const spacing = 50;

        function project(x, y, z) {
            const perspective = 600;
            const scale = perspective / (perspective + y);
            const sx = (x * scale) + (width / 2);
            // Move the center of the ocean down slightly
            const sy = (z * scale) + (y * 0.4) + (height * 0.3); 
            return { x: sx, y: sy, s: scale };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            time += 0.008;

            for (let y = 0; y < gridY; y++) {
                for (let x = -gridX / 2; x < gridX / 2; x++) {
                    
                    // Wave Math: Two layers of Sine/Cosine for organic movement
                    const getZ = (xi, yi) => {
                        return Math.sin(xi * 0.2 + time * 2) * 15 + 
                               Math.cos(yi * 0.3 - time * 1.5) * 10;
                    };

                    const p1 = project(x * spacing, y * spacing, getZ(x, y));
                    const p2 = project((x + 1) * spacing, y * spacing, getZ(x + 1, y));
                    const p3 = project((x + 1) * spacing, (y + 1) * spacing, getZ(x + 1, y + 1));
                    const p4 = project(x * spacing, (y + 1) * spacing, getZ(x, y + 1));

                    // Shading logic: Deeper water is darker
                    const blueValue = Math.floor(40 + (y * 3));
                    const opacity = Math.max(0.1, 1 - (y / gridY)); // Fade into horizon

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.lineTo(p4.x, p4.y);
                    ctx.closePath();

                    ctx.fillStyle = `rgba(0, ${blueValue}, ${blueValue + 40}, ${opacity})`;
                    ctx.fill();
                    
                    // Subtle grid lines for that "tech" survival feel
                    ctx.strokeStyle = `rgba(0, 212, 255, ${opacity * 0.2})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
            requestAnimationFrame(draw);
        }

        function openPlayMenu() {
            document.body.classList.add('menu-open');
        }

        draw();
    </script>
</body>
</html>
