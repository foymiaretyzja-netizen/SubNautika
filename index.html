<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnautika - Title Screen</title>
    <style>
        :root {
            --sub-blue: #00d4ff;
            --sub-dark: rgba(0, 20, 40, 0.8);
            --sub-glow: 0 0 15px rgba(0, 212, 255, 0.6);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 40%, #003366 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%; /* Ocean takes up the bottom 60% */
            z-index: 1;
        }

        /* UI Layer */
        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .logo {
            width: 500px;
            margin-bottom: 40px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
            transition: transform 0.8s ease;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.8s ease;
        }

        .btn {
            background: var(--sub-dark);
            border: 2px solid var(--sub-blue);
            color: white;
            width: 280px;
            padding: 12px 25px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 50px;
            display: flex;
            align-items: center;
            transition: 0.3s;
            box-shadow: var(--sub-glow);
        }

        .btn:hover {
            background: var(--sub-blue);
            color: #000;
            box-shadow: 0 0 25px var(--sub-blue);
            transform: scale(1.05);
        }

        .btn::before {
            content: '';
            width: 12px;
            height: 12px;
            border: 2px solid currentColor;
            border-radius: 50%;
            margin-right: 15px;
        }

        /* Play Menu Panel */
        #play-menu {
            position: absolute;
            right: -500px;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            background: rgba(0, 40, 80, 0.8);
            backdrop-filter: blur(15px);
            border: 2px solid var(--sub-blue);
            border-radius: 15px;
            padding: 25px;
            color: white;
            transition: right 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .mode-option {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--sub-blue);
            cursor: pointer;
        }

        .mode-option h3 { margin: 0 0 5px 0; color: var(--sub-blue); }
        .mode-option p { margin: 0; font-size: 0.9rem; opacity: 0.8; }

        /* Transition State */
        .menu-active #ui-layer {
            align-items: flex-start;
            padding-left: 10%;
        }

        .menu-active #play-menu {
            right: 10%;
        }
    </style>
</head>
<body>

    <canvas id="ocean"></canvas>

    <div id="ui-layer">
        <img src="textures/Subnautika.png" alt="SUBNAUTIKA" class="logo">
        
        <div class="button-group">
            <button class="btn" onclick="showPlayMenu()">Play</button>
            <button class="btn" onclick="alert('Not accessible yet!')">Options</button>
            <button class="btn" onclick="alert('Not accessible yet!')">Quit</button>
        </div>
    </div>

    <div id="play-menu">
        <h2 style="margin-top: 0;">Select Gamemode</h2>
        <div class="mode-option" onclick="alert('Starting Survival...')">
            <h3>Survival</h3>
            <p>Gather resources, manage oxygen, and explore the depths. The standard way to play.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ocean');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight * 0.6;
        }

        window.addEventListener('resize', resize);
        resize();

        // 3D Grid Constants
        const cols = 30;
        const rows = 20;
        const spacing = 60;

        function project(x, y, z) {
            // Basic 3D to 2D projection
            // x, y are grid positions, z is the calculated height
            const perspective = 400;
            const scale = perspective / (perspective + y); 
            const sx = (x * spacing * scale) + (width / 2);
            const sy = (z * scale) + (y * 15); // Perspective "tilt"
            return { x: sx, y: sy };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            time += 0.02;

            ctx.strokeStyle = 'rgba(0, 212, 255, 0.4)';
            ctx.lineWidth = 1;

            for (let r = 0; r < rows; r++) {
                ctx.beginPath();
                for (let c = -cols; c <= cols; c++) {
                    // Ocean Math: Summing multiple sine waves for "3D" complexity
                    const x = c;
                    const y = r * 2;
                    const z = Math.sin(x * 0.3 + time) * 20 + 
                              Math.cos(y * 0.5 - time) * 15;

                    const pos = project(x * 20, y * 20, z);

                    if (c === -cols) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                ctx.stroke();
            }

            // Draw vertical lines for the grid effect
            for (let c = -cols; c <= cols; c += 2) {
                ctx.beginPath();
                for (let r = 0; r < rows; r++) {
                    const x = c;
                    const y = r * 2;
                    const z = Math.sin(x * 0.3 + time) * 20 + 
                              Math.cos(y * 0.5 - time) * 15;
                    const pos = project(x * 20, y * 20, z);
                    if (r === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }

        function showPlayMenu() {
            document.body.classList.add('menu-active');
        }

        draw();
    </script>
</body>
</html>
