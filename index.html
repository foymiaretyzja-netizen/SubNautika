<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subnautika - Deep 3D Ocean</title>
    <style>
        :root {
            --sub-cyan: #00e1ff;
            --sub-deep: #001a1a;
            --glass: rgba(0, 15, 20, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a2a3a 0%, #3a506b 40%, #5a7b8f 70%);
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Fixed UI Container */
        #ui-wrapper {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Panel Group for Smooth Sliding */
        .ui-scene {
            display: flex;
            width: 200%; /* Two panels wide */
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        /* Section 1: Main Menu */
        .panel-main {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        /* Section 2: Gamemode Selection */
        .panel-modes {
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 5%;
            pointer-events: auto;
        }

        .logo {
            width: 500px;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: var(--glass);
            border: 1px solid rgba(0, 225, 255, 0.3);
            color: white;
            width: 280px;
            padding: 15px 25px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: var(--sub-cyan);
            color: #000;
            transform: translateX(15px);
            box-shadow: 0 0 25px rgba(0, 225, 255, 0.5);
        }

        .mode-panel {
            background: var(--glass);
            width: 420px;
            padding: 40px;
            border-left: 3px solid var(--sub-cyan);
            color: white;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .mode-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            margin-top: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-card:hover {
            background: rgba(255,255,255,0.1);
            outline: 1px solid var(--sub-cyan);
        }

        /* State trigger */
        body.mode-active .ui-scene {
            transform: translateX(-35%); /* Adjusts logo to the left, reveals modes */
        }
    </style>
</head>
<body>

    <canvas id="ocean"></canvas>

    <div id="ui-wrapper">
        <div class="ui-scene">
            <div class="panel-main">
                <img src="textures/Subnautika.png" alt="SUBNAUTIKA" class="logo">
                <div class="btn-stack">
                    <button class="btn" onclick="openModes()">Play</button>
                    <button class="btn" onclick="alert('Not accessible yet!')">Options</button>
                    <button class="btn" onclick="alert('Not accessible yet!')">Quit</button>
                </div>
            </div>

            <div class="panel-modes">
                <div class="mode-panel">
                    <h2 style="letter-spacing: 5px; font-weight: 300;">NEW GAME</h2>
                    <div class="mode-card" onclick="alert('Starting Survival...')">
                        <h3 style="margin:0; color: var(--sub-cyan);">SURVIVAL</h3>
                        <p style="font-size: 13px; opacity: 0.7;">Gather resources and survive the depths.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ocean');
        const ctx = canvas.getContext('2d');

        let width, height, time = 0;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 3D Grid Parameters
        const rows = 45; 
        const cols = 55;
        const spacing = 50;

        function project(x, y, z) {
            const perspective = 800;
            const scale = perspective / (perspective + y);
            const sx = (x * scale) + (width / 2);
            const sy = (z * scale) + (y * 0.5) + (height * 0.4); 
            return { x: sx, y: sy, scale: scale };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            time += 0.008;

            // Render Back to Front
            for (let y = rows; y >= 0; y--) {
                for (let x = -cols/2; x < cols/2; x++) {
                    
                    const getZ = (xi, yi) => {
                        // Multi-octave wave math for "True 3D" feel
                        let z = Math.sin(xi * 0.15 + time * 1.5) * 15;
                        z += Math.cos(yi * 0.1 + time * 2) * 12;
                        z += Math.sin((xi + yi) * 0.1 + time) * 10;
                        return z;
                    };

                    const z1 = getZ(x, y);
                    const z2 = getZ(x + 1, y);
                    const z3 = getZ(x + 1, y + 1);
                    const z4 = getZ(x, y + 1);

                    const p1 = project(x * spacing, y * spacing, z1);
                    const p2 = project((x + 1) * spacing, y * spacing, z2);
                    const p3 = project((x + 1) * spacing, (y + 1) * spacing, z3);
                    const p4 = project(x * spacing, (y + 1) * spacing, z4);

                    // --- 3D Shading Math ---
                    // We calculate the color based on height (z) and slope
                    const brightness = (z1 + 30) / 60; // 0 to 1
                    const r = 0;
                    const g = Math.floor(20 + brightness * 40);
                    const b = Math.floor(30 + brightness * 60);
                    
                    // Atmosphere/Fog: Fade quads as they get further away (higher y)
                    const opacity = Math.max(0, 1 - (y / rows));

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.lineTo(p4.x, p4.y);
                    ctx.closePath();

                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${opacity})`;
                    ctx.fill();

                    // Surface highlights (Specular peaks)
                    if (z1 > 10) {
                        ctx.strokeStyle = `rgba(0, 225, 255, ${opacity * 0.2})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }

        function openModes() {
            document.body.classList.add('mode-active');
        }

        draw();
    </script>
</body>
</html>
