<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnautika - Title Screen</title>
    <style>
        :root {
            --sub-blue: rgba(0, 162, 255, 0.6);
            --sub-glow: rgba(0, 225, 255, 0.8);
            --ui-bg: rgba(0, 40, 80, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Wave Background */
        #waterCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* Main Wrapper */
        #ui-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Logo Styling */
        .logo {
            max-width: 600px;
            margin-bottom: 50px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
            transition: transform 0.8s ease;
        }

        /* Button Containers */
        .menu-container {
            display: flex;
            gap: 20px;
            transition: transform 0.8s ease, opacity 0.8s ease;
        }

        /* Subnautica Style Buttons */
        .btn {
            background: var(--ui-bg);
            border: 2px solid var(--sub-blue);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            display: flex;
            align-items: center;
            min-width: 200px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .btn:hover {
            background: var(--sub-blue);
            box-shadow: 0 0 20px var(--sub-glow);
            transform: scale(1.05);
        }

        .btn::before {
            content: '○';
            margin-right: 15px;
            font-weight: bold;
        }

        /* Game Mode Panel (Hidden initially) */
        #gamemode-panel {
            position: absolute;
            right: -500px;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            background: rgba(0, 100, 200, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid var(--sub-blue);
            padding: 20px;
            color: white;
            border-radius: 10px;
            transition: right 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 5px solid var(--sub-glow);
        }

        .mode-card h3 { margin: 0 0 5px 0; color: #0cf; }
        .mode-card p { margin: 0; font-size: 0.9rem; opacity: 0.9; }

        /* State Classes */
        .state-selecting-mode #ui-wrapper {
            align-items: flex-start;
            padding-left: 10%;
        }

        .state-selecting-mode #gamemode-panel {
            right: 10%;
        }
    </style>
</head>
<body>

    <canvas id="waterCanvas"></canvas>

    <div id="ui-wrapper">
        <img src="textures/Subnautika.png" alt="Subnautika Logo" class="logo">
        
        <div class="menu-container" id="main-menu">
            <button class="btn" onclick="openPlayMenu()">Play</button>
            <button class="btn" onclick="notAccessible()">Options</button>
            <button class="btn" onclick="notAccessible()">Quit</button>
        </div>
    </div>

    <div id="gamemode-panel">
        <h2 style="border-bottom: 1px solid white; padding-bottom: 10px;">New Game</h2>
        <div class="mode-card" style="cursor: pointer;" onclick="alert('Starting Survival...')">
            <h3>Survival</h3>
            <p>Crash land in a dangerous environment, scavenge resources and manage oxygen levels to survive.</p>
        </div>
        <div class="mode-card" style="opacity: 0.5; cursor: not-allowed;">
            <h3>Freedom</h3>
            <p>(Locked) Survival, but without hunger or thirst.</p>
        </div>
        <div class="mode-card" style="opacity: 0.5; cursor: not-allowed;">
            <h3>Hardcore</h3>
            <p>(Locked) Survival mode with only one life. No O2 alerts.</p>
        </div>
    </div>

    <script>
        // --- Wave Math Logic ---
        const canvas = document.getElementById('waterCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let offset = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawWaves() {
            ctx.clearRect(0, 0, width, height);
            
            // Create a deep ocean gradient
            let gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#001a33');
            gradient.addColorStop(1, '#00050a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            drawWave(40, 0.005, 0.02, 'rgba(0, 150, 255, 0.1)');
            drawWave(30, 0.01, 0.04, 'rgba(0, 200, 255, 0.15)');
            drawWave(20, 0.015, 0.03, 'rgba(0, 100, 200, 0.2)');

            offset += 0.01;
            requestAnimationFrame(drawWaves);
        }

        function drawWave(amplitude, frequency, speed, color) {
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            
            for (let x = 0; x < width; x++) {
                // Wave Math: y = sin(x * freq + time) * amp
                let y = Math.sin(x * frequency + (offset * speed * 10)) * amplitude;
                
                // Add a secondary wave to break repetition
                y += Math.cos(x * frequency * 0.5 + (offset * speed * 5)) * (amplitude / 2);
                
                ctx.lineTo(x, (height / 1.5) + y);
            }

            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fillStyle = color;
            ctx.fill();
        }

        drawWaves();

        // --- UI Interaction ---
        function openPlayMenu() {
            document.body.classList.add('state-selecting-mode');
        }

        function notAccessible() {
            alert('Not accessible yet!');
        }
    </script>
</body>
</html>
