<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnautika - Main Menu</title>
    <style>
        :root {
            --ui-blue: rgba(0, 162, 255, 0.4);
            --ui-border: rgba(134, 218, 255, 0.8);
            --text-color: #e0f4ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #00121d;
        }

        /* Wave Background Canvas */
        #waterCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Container */
        .ui-overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, transparent 50%, rgba(0,0,0,0.4) 100%);
        }

        .logo {
            max-width: 600px;
            width: 80%;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(0, 162, 255, 0.5));
        }

        .main-layout {
            display: flex;
            width: 80%;
            max-width: 1200px;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 40px;
        }

        /* Left Side Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            background: var(--ui-blue);
            border: 2px solid var(--ui-border);
            color: white;
            padding: 12px 60px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            min-width: 200px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .menu-btn:hover {
            background: rgba(0, 162, 255, 0.7);
            transform: translateX(10px);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.4);
        }

        /* Right Side Modes Panel */
        .modes-panel {
            background: var(--ui-blue);
            border: 2px solid var(--ui-border);
            backdrop-filter: blur(10px);
            width: 400px;
            border-radius: 10px;
            padding: 20px;
            color: white;
        }

        .mode-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.2s;
        }

        .mode-item:last-child { border-bottom: none; }

        .mode-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .mode-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
            display: block;
        }

        .mode-desc {
            font-size: 0.85rem;
            opacity: 0.8;
            line-height: 1.3;
        }

    </style>
</head>
<body>

    <canvas id="waterCanvas"></canvas>

    <div class="ui-overlay">
        <img src="textures/Subnautika.png" alt="SUBNAUTIKA" class="logo">

        <div class="main-layout">
            <div class="button-group">
                <button class="menu-btn" onclick="startGame()">Play</button>
                <button class="menu-btn" onclick="notAccessible()">Options</button>
                <button class="menu-btn" onclick="notAccessible()">Quit</button>
            </div>

            <div class="modes-panel">
                <h3 style="margin-top:0">New Game</h3>
                <div class="mode-item" onclick="notAccessible()">
                    <span class="mode-title">Survival</span>
                    <span class="mode-desc">Craft items, manage oxygen, and survive the depths.</span>
                </div>
                <div class="mode-item" onclick="notAccessible()">
                    <span class="mode-title">Freedom</span>
                    <span class="mode-desc">Like Survival, but without hunger or thirst.</span>
                </div>
                <div class="mode-item" onclick="notAccessible()">
                    <span class="mode-title">Hardcore</span>
                    <span class="mode-desc">Survival mode with only one life. No O2 alerts.</span>
                </div>
                <div class="mode-item" onclick="notAccessible()">
                    <span class="mode-title">Creative</span>
                    <span class="mode-desc">Build anything with no constraints. Oxygen and health disabled.</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Wave Math Background ---
        const canvas = document.getElementById('waterCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, startTime;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawWaves(time) {
            ctx.clearRect(0, 0, width, height);
            
            // Create a deep ocean gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#003a5e');
            gradient.addColorStop(1, '#00121d');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Wave Layers
            // Parameters: amplitude, frequency, speed, color, opacity
            drawSingleWave(time, 30, 0.005, 0.002, '#00a2ff', 0.2);
            drawSingleWave(time, 20, 0.008, 0.003, '#0077b3', 0.3);
            drawSingleWave(time, 15, 0.012, 0.001, '#00d0ff', 0.1);

            requestAnimationFrame(drawWaves);
        }

        function drawSingleWave(time, amplitude, freq, speed, color, alpha) {
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;

            for (let x = 0; x <= width; x++) {
                // The "Wave Math": y = amplitude * sin(frequency * x + time * speed)
                // We add multiple sin waves together to make it look more organic/less repeating
                const y = height / 1.8 + 
                          amplitude * Math.sin(x * freq + time * speed) +
                          (amplitude/2) * Math.sin(x * freq * 2 + time * speed * 0.8);
                
                ctx.lineTo(x, y);
            }

            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(drawWaves);

        // --- UI Logic ---
        function notAccessible() {
            alert('Not accessable yet!');
        }

        function startGame() {
            alert('Initiating Lifepod deployment...');
        }
    </script>
</body>
</html>
