<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Screen</title>
    <style>
        /* --- Reset & Base Styles --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #001e36;
        }

        /* --- 3D Canvas Background --- */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* --- UI Overlay --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            pointer-events: none; /* Let clicks pass through empty spaces */
        }

        /* --- Logo --- */
        .logo-container {
            width: 100%;
            text-align: center;
            margin-top: 10vh;
        }
        .logo-container img {
            max-width: 600px;
            width: 80%;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));
        }

        /* --- Interactive Container --- */
        .interactive-area {
            flex-grow: 1;
            position: relative;
            pointer-events: auto;
        }

        /* --- Main Menu --- */
        .main-menu {
            position: absolute;
            bottom: 15vh;
            left: 20vw;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.5s ease-in-out, opacity 0.5s ease;
        }

        /* Shifts left when Play is clicked */
        .main-menu.shifted {
            transform: translateX(-10vw);
        }

        .menu-btn {
            background: linear-gradient(90deg, rgba(0, 105, 180, 0.8) 0%, rgba(0, 160, 255, 0.6) 100%);
            border: 2px solid #4dfaff;
            border-radius: 25px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 40px 10px 50px;
            cursor: pointer;
            position: relative;
            text-align: left;
            width: 250px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .menu-btn:hover {
            background: linear-gradient(90deg, rgba(0, 140, 220, 0.9) 0%, rgba(50, 200, 255, 0.8) 100%);
            box-shadow: 0 0 15px #4dfaff;
            transform: scale(1.05);
        }

        /* The circle detail on the left of the buttons */
        .menu-btn::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            border: 2px solid #4dfaff;
            border-radius: 50%;
            background: transparent;
        }

        /* --- Gamemode Menu --- */
        .gamemode-menu {
            position: absolute;
            bottom: 15vh;
            left: 45vw; /* Positioned to the right of the shifted main menu */
            background: rgba(0, 50, 100, 0.7);
            border: 2px solid #4dfaff;
            border-radius: 8px;
            width: 400px;
            padding: 20px;
            color: white;
            opacity: 0;
            visibility: hidden;
            transform: translateX(20px);
            transition: all 0.5s ease-in-out;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .gamemode-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        .gamemode-title {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #4dfaff;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(77, 250, 255, 0.3);
            padding-bottom: 10px;
        }

        .gamemode-item {
            background: rgba(0, 105, 180, 0.5);
            border: 1px solid #4dfaff;
            border-radius: 5px;
            padding: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .gamemode-item:hover {
            background: rgba(0, 160, 255, 0.6);
        }

        .gamemode-item h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .gamemode-item p {
            margin: 0;
            font-size: 0.85rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        
        <div class="logo-container">
            <img src="textures/Subnautika.png" alt="Game Logo">
        </div>

        <div class="interactive-area">
            
            <div class="main-menu" id="mainMenu">
                <button class="menu-btn" onclick="togglePlayMenu()">Play</button>
                <button class="menu-btn" onclick="showNotAccessible()">Options</button>
                <button class="menu-btn" onclick="showNotAccessible()">Quit</button>
            </div>

            <div class="gamemode-menu" id="gamemodeMenu">
                <h2 class="gamemode-title">New Game</h2>
                <div class="gamemode-item" onclick="startGame()">
                    <h3>Survival</h3>
                    <p>Scavenge resources, manage hunger/thirst, and survive the depths.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <script>
        // --- UI LOGIC ---
        let isPlayMenuOpen = false;

        function togglePlayMenu() {
            const mainMenu = document.getElementById('mainMenu');
            const gamemodeMenu = document.getElementById('gamemodeMenu');
            
            isPlayMenuOpen = !isPlayMenuOpen;

            if (isPlayMenuOpen) {
                mainMenu.classList.add('shifted');
                gamemodeMenu.classList.add('active');
            } else {
                mainMenu.classList.remove('shifted');
                gamemodeMenu.classList.remove('active');
            }
        }

        function showNotAccessible() {
            alert('Not accessible yet!');
        }

        function startGame() {
            alert('Starting Survival mode...');
        }

        // --- 3D WATER GENERATION (Three.js + Perlin/Simplex Noise) ---
        const container = document.getElementById('canvas-container');
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
        camera.position.set(0, 50, 200); // Angle camera looking down at the water
        camera.lookAt(0, 0, 0);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(-1, 1, 1).normalize();
        scene.add(directionalLight);

        // Water Plane Geometry
        // Create a large plane with many segments to bend vertices
        const geometry = new THREE.PlaneGeometry(2000, 2000, 100, 100);
        geometry.rotateX(-Math.PI / 2); // Lay flat

        // Water Material (shiny blue)
        const material = new THREE.MeshPhongMaterial({
            color: 0x005588,
            specular: 0x111111,
            shininess: 80,
            flatShading: true // Gives a stylized, low-poly/crisp wave look
        });

        const water = new THREE.Mesh(geometry, material);
        scene.add(water);

        // Noise setup
        const simplex = new SimplexNoise();
        const posAttribute = geometry.attributes.position;
        const initialY = []; // Store base positions

        for (let i = 0; i < posAttribute.count; i++) {
            initialY.push(posAttribute.getY(i));
        }

        let time = 0;

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            time += 0.003; // Speed of the waves

            // Modify vertices using Perlin/Simplex noise
            for (let i = 0; i < posAttribute.count; i++) {
                const x = posAttribute.getX(i);
                const z = posAttribute.getZ(i);
                
                // Scale inputs to adjust wave frequency
                const noiseScale = 0.005;
                const waveHeight = 15;
                
                // Calculate new Y position based on 3D noise (x, z, time)
                const y = simplex.noise3D(x * noiseScale, z * noiseScale, time) * waveHeight;
                
                posAttribute.setY(i, y);
            }
            
            // Tell Three.js the geometry has changed
            posAttribute.needsUpdate = true;
            geometry.computeVertexNormals(); // Recalculate lighting interaction

            // Slowly rotate camera for dynamic feel
            camera.position.x = Math.sin(time) * 100;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
